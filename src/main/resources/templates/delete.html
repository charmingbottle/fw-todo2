<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">このやることを削除します</h1>

        <p class="confirm-value">やること：<span th:text="${todo.title ?: '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category ?: '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate ?: '（入力なし）'}">（入力なし）</span></p>

        <form method="post" th:action="@{/todos/{id}/delete(id=${id})}">
            <div class="confirm-actions">
                <button class="btn" type="submit">消す</button>
                <a class="btn sub" href="/todos">やめる</a>
            </div>
        </form>
    </main>
</body>
</html>
