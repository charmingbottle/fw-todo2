<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <p class="flash" th:if="${message}" th:text="${message}">逋ｻ骭ｲ縺励∪縺励◆</p>

        <h1 class="page-title">やること一覧</h1>

        <form class="search-bar" action="/todos" method="get">
            <label class="form-label" for="keyword">やること</label>
            <input class="form-input" id="keyword" name="keyword" type="text" th:value="${keyword}">

            <label class="form-label" for="category">ジャンル</label>
            <select class="form-input" id="category" name="category">
                <option value="" th:selected="${category == null or category == ''}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            </select>

            <input type="hidden" name="order" th:value="${order}">
            <button class="btn" type="submit">絞り込む</button>
        </form>

        <p>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc')}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc')}">期限が遠い順</a>
        </p>

        <p><a class="link" href="/todos/new">新規登録</a></p>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">中</td>
                    <td th:text="${todo.dueDate}">2026-04-11</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">未完了</td>
                    <td>
                        <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                        <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
